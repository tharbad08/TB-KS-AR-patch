name: Validate KS-AR Patch
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate invariants without proprietary assemblies
        run: python3 scripts/validate.py
      - name: Explain local verified-build procedure
        run: |
          echo "Builds require genuine game/mod DLLs kept outside GitHub. Run scripts/build-local.sh /path/to/build-refs.zip on a machine with .NET 8 SDK."
